name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug-APK bauen
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build.log

      - name: Build-Fehler als Annotationen
        if: failure()
        shell: bash
        run: |
          grep -iE '^e: |requires|minCompileSdk|Android Gradle plugin|Dependency |depend on|is not|Caused by' build.log | grep -v '^> Task' | head -10 | while IFS= read -r line; do echo "::error title=Build::$line"; done

      - name: Lint
        run: ./gradlew lintDebug

      - name: Lint-Befunde 1-10
        if: always()
        run: |
          f=app/build/reports/lint.txt
          [ -f "$f" ] || exit 0
          grep -E ': (Warning|Error|Information): ' "$f" | sed -n '1,10p' | while IFS= read -r line; do echo "::warning title=Lint::$line"; done
      - name: Lint-Befunde 11-20
        if: always()
        run: |
          f=app/build/reports/lint.txt
          [ -f "$f" ] || exit 0
          grep -E ': (Warning|Error|Information): ' "$f" | sed -n '11,20p' | while IFS= read -r line; do echo "::warning title=Lint::$line"; done
      - name: Lint-Befunde 21-30
        if: always()
        run: |
          f=app/build/reports/lint.txt
          [ -f "$f" ] || exit 0
          grep -E ': (Warning|Error|Information): ' "$f" | sed -n '21,30p' | while IFS= read -r line; do echo "::warning title=Lint::$line"; done
      - name: Lint-Befunde 31-40
        if: always()
        run: |
          f=app/build/reports/lint.txt
          [ -f "$f" ] || exit 0
          grep -E ': (Warning|Error|Information): ' "$f" | sed -n '31,40p' | while IFS= read -r line; do echo "::warning title=Lint::$line"; done
      - name: Lint-Zusammenfassung
        if: always()
        run: '[ -f app/build/reports/lint.txt ] && echo "::notice title=Lint-Summe::$(tail -1 app/build/reports/lint.txt)" || true'

      - name: Release-Build (unsigniert) prüfen – R8/Shrinking
        shell: bash
        run: |
          set -o pipefail
          ./gradlew bundleRelease 2>&1 | tee release.log

      - name: Release-Fehler als Annotationen
        if: failure()
        shell: bash
        run: |
          grep -iE '^e: |ERROR|Missing class|What went wrong|Caused by|R8' release.log | grep -v '^> Task' | head -10 | while IFS= read -r line; do echo "::error title=Release::$line"; done

      - uses: actions/upload-artifact@v4
        with:
          name: binary-clock-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
