name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug --stacktrace

      - name: Lint
        run: ./gradlew lintDebug

      - name: Lint-Befunde als Annotationen
        if: always()
        run: |
          f=app/build/reports/lint.txt
          [ -f "$f" ] || exit 0
          grep -E ': (Warning|Error|Information): ' "$f" | head -40 | while IFS= read -r line; do
            echo "::warning title=Lint::$line"
          done
          tail -1 "$f"

      - name: Release-Build (unsigniert) prüfen – R8/Shrinking
        run: ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: binary-clock-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
